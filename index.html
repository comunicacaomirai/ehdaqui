<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EH DAQUI - Guia do Comércio Local</title>
    <style>
        :root { --primary: #5c67f2; --text: #2d3436; }
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #e0eafc, #cfdef3); }
        .container { background: white; padding: 2.5rem; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        button { background: var(--primary); color: white; border: none; padding: 18px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; width: 100%; }
        .hidden { display: none; }
    </style>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({ appId: "8dd0349a-9dd8-4670-adcd-e53729853bd7" });
      });
    </script>
</head>
<body>

    <div class="container" id="tela-inicial">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📍</div>
        <h1>EH DAQUI</h1>
        <p>Conecte-se com as melhores ofertas e serviços do seu terminal.</p>
        <button id="btn-iniciar">Ativar Experiência</button>
    </div>

    <!-- Tela de Sucesso (escondida inicialmente) -->
    <div class="container hidden" id="tela-sucesso">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
        <h1>Tudo certo!</h1>
        <p>Bem-vindo! Agora, sempre que você estiver próximo ao terminal, receberá notificações com promoções e ofertas exclusivas.</p>
        <p style="font-size: 0.9rem; color: #b2bec3;">Pode fechar esta página.</p>
    </div>

    <script>
        document.getElementById('btn-iniciar').addEventListener('click', async () => {
            window.OneSignalDeferred.push(async function(OneSignal) {
                // 1. Pede permissão de Notificação
                await OneSignal.Slidedown.promptPush();
                
                // 2. Pede permissão de Localização
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        OneSignal.User.addTag("regiao", "terminal_onibus");
                        
                        // 3. Troca a tela
                        document.getElementById('tela-inicial').classList.add('hidden');
                        document.getElementById('tela-sucesso').classList.remove('hidden');
                    }, (error) => {
                        alert("Precisamos da localização para ativar as ofertas exclusivas.");
                    });
                }
            });
        });
    </script>
</body>
</html>
