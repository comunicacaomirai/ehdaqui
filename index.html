<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EH DAQUI - Guia do Comércio Local</title>
    <style>
        :root { 
            --primary: #5c67f2; 
            --text: #2d3436; 
            --bg: #f8f9fe;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #e0eafc, #cfdef3); 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        h1 { 
            color: var(--primary); 
            margin-bottom: 0.5rem; 
            font-size: 2rem;
        }
        p { 
            color: #636e72; 
            line-height: 1.5; 
            margin-bottom: 2rem; 
            font-size: 1.1rem;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        /* Estilização para o elemento de inscrição do OneSignal */
        .onesignal-customlink-container {
            margin-top: 15px;
        }
    </style>
    
    <!-- OneSignal SDK com o seu novo App ID -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "8dd0349a-9dd8-4670-adcd-e53729853bd7",
        });

        // Adiciona automaticamente a tag de região para segmentação das ofertas do terminal
        OneSignal.User.addTag("regiao", "terminal_onibus");
      });
    </script>
</head>
<body>

    <div class="container">
        <div class="icon">📍</div>
        <h1>EH DAQUI</h1>
        <p>Conecte-se com as melhores ofertas e serviços do seu terminal em tempo real.</p>
        
        <!-- Botão/Link Oficial de Inscrição do OneSignal -->
        <div class="onesignal-customlink-container"></div>
    </div>

    <script>
        // Captura opcional da geolocalização do usuário para fins de registro local
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                console.log("Geolocalização obtida:", position.coords.latitude, position.coords.longitude);
            }, (error) => {
                console.log("Geolocalização não autorizada ou indisponível.");
            });
        }
    </script>
</body>
</html>
