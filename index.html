<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas de Ofertas Locais</title>
    
    <!-- Estilos mobile-first limpos e profissionais -->
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-ativar {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.2s;
        }
        .btn-ativar:hover {
            background-color: #1ebd59;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>

    <!-- PushAlert Unified Code -->
    <script type="text/javascript">
        (function(d, t) {
            var g = d.createElement(t);
            var s = d.getElementsByTagName(t)[0];
            g.src = "https://cdn.pushalert.co/unified_4c8c14a4cd48817097f3d42f7b419b33.js";
            s.parentNode.insertBefore(g, s);
        }(document, "script"));
    </script>
</head>
<body>

    <div class="card">
        <h1>🔔 Alertas de Ofertas Locais</h1>
        <p>Receba descontos relâmpago, cupons e promoções exclusivas dos comércios da região direto na tela do seu celular.</p>
        
        <!-- Botão opcional que dispara o prompt de inscrição do PushAlert -->
        <button class="btn-ativar" onclick="ativarNotificacoes()">Quero Receber Ofertas</button>
        
        <div class="footer">
            Sem spam. Cancele quando quiser.
        </div>
    </div>

    <script>
        // Função para acionar a janela de permissão ao clicar no botão
        function ativarNotificacoes() {
            if (typeof pushalert !== 'undefined') {
                pushalert.prompt();
            } else {
                console.log("PushAlert ainda está carregando...");
            }
        }
    </script>

</body>
</html>
