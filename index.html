<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EH DAQUI - Guia do Comércio Local</title>
    <style>
        :root {
            --primary: #5c67f2;
            --secondary: #ff7e5f;
            --bg: #f8f9fe;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: var(--text);
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        p {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            width: 100%;
            box-shadow: 0 5px 15px rgba(92, 103, 242, 0.3);
        }

        button:hover {
            transform: scale(1.03);
            background: #4a54e1;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "8dd0349a-9dd8-4670-adcd-e53729853bd7",
        });
      });
    </script>
</head>
<body>

    <div class="container">
        <div class="icon">📍</div>
        <h1>EH DAQUI</h1>
        <p>Conecte-se com as melhores ofertas e serviços do seu terminal em tempo real.</p>
        <button id="btn-iniciar">Ativar Experiência</button>
    </div>

    <script>
        document.getElementById('btn-iniciar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-iniciar');
            btn.innerText = "Ativando...";
            
            try {
                // Força a exibição do prompt de inscrição do OneSignal
                await OneSignal.Slidedefault?.push || OneSignal.showSlidedownPrompt();
                
                // Tenta capturar a geolocalização com tratamento de erro e timeout
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        OneSignal.User.addTag("regiao", "terminal_onibus");
                        btn.innerText = "Sucesso! ✅";
                        btn.style.background = "#27ae60";
                        alert("Tudo pronto! Você receberá ofertas exclusivas quando estiver no terminal.");
                    }, (error) => {
                        // Mesmo se o GPS falhar, destrava o botão para não prender o usuário
                        btn.innerText = "Ativado (Sem GPS) ⚠️";
                        btn.style.background = "#f39c12";
                        alert("Notificações ativadas, mas não foi possível ler a localização exata.");
                    }, { timeout: 10000 });
                } else {
                    btn.innerText = "Sucesso! ✅";
                    btn.style.background = "#27ae60";
                }
            } catch (err) {
                console.error("Erro ao ativar:", err);
                btn.innerText = "Tentar Novamente";
                btn.style.background = "#e74c3c";
                alert("Ocorreu um erro ao ativar. Verifique se o navegador bloqueou a permissão.");
            }
        });
    </script>
</body>
</html>
